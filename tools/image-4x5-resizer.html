<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>4:5 Image Resizer — 1080 × 1350</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #181b22;
    --border: #2a2f3a;
    --accent: #7c5cff;
    --accent-2: #00d4a0;
    --text: #e7e9ee;
    --muted: #9aa1ad;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 28px 16px 60px;
  }
  .wrap { max-width: 920px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 22px; }
  .controls {
    display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; padding: 14px 16px; margin-bottom: 18px;
  }
  .controls label { font-size: 13px; color: var(--muted); }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .seg button {
    background: transparent; color: var(--text); border: none;
    padding: 8px 14px; cursor: pointer; font-size: 13px;
  }
  .seg button.active { background: var(--accent); color: #fff; }
  select, input[type=color] {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 10px; font-size: 13px;
  }
  #drop {
    border: 2px dashed var(--border); border-radius: 16px;
    padding: 46px 20px; text-align: center; cursor: pointer;
    transition: .15s; background: var(--panel);
  }
  #drop.hover { border-color: var(--accent); background: #1d2030; }
  #drop strong { color: var(--accent); }
  #drop p { margin: 6px 0; color: var(--muted); font-size: 14px; }
  .big { font-size: 16px; color: var(--text) !important; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 16px; margin-top: 22px;
  }
  .card {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 12px; overflow: hidden; display: flex; flex-direction: column;
  }
  .card .preview {
    background: #000; aspect-ratio: 4 / 5; display: flex; align-items: center; justify-content: center;
  }
  .card img { width: 100%; height: 100%; object-fit: contain; }
  .card .meta { padding: 10px 12px; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
  .card .dl {
    display: block; text-align: center; text-decoration: none;
    background: var(--accent-2); color: #06231b; font-weight: 600;
    padding: 10px; font-size: 13px;
  }
  .card .dl:hover { filter: brightness(1.08); }
  .bar { display: flex; gap: 12px; margin-top: 18px; }
  .bar button {
    background: var(--accent); color: #fff; border: none; border-radius: 10px;
    padding: 11px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .bar button.ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .bar button:disabled { opacity: .4; cursor: not-allowed; }
  .hidden { display: none; }
  code { background: #11141a; padding: 2px 6px; border-radius: 5px; color: var(--accent-2); }
</style>
</head>
<body>
<div class="wrap">
  <h1>4:5 Image Resizer → 1080 × 1350</h1>
  <p class="sub">ChatGPT ki tall image daalo, exact <code>1080 × 1350</code> (4:5) nikalo — <strong>bina kuch crop kiye</strong>. Sab kuch tumhare browser me — koi upload nahi hota.</p>

  <div class="controls">
    <div>
      <label>Mode</label><br/>
      <div class="seg" id="modeSeg">
        <button data-mode="blur" class="active">Blur Fill (no crop ✅)</button>
        <button data-mode="contain">Solid Background (no crop)</button>
        <button data-mode="cover">Smart Crop</button>
      </div>
    </div>
    <div id="bgWrap" class="hidden">
      <label>Background</label><br/>
      <input type="color" id="bgColor" value="#000000" />
    </div>
    <div id="blurWrap">
      <label>Blur strength</label><br/>
      <input type="range" id="blurAmt" min="10" max="80" value="40" />
    </div>
    <div>
      <label>Format</label><br/>
      <select id="fmt">
        <option value="image/jpeg">JPG (chhoti file)</option>
        <option value="image/png">PNG (lossless)</option>
      </select>
    </div>
  </div>

  <div id="drop">
    <p class="big"><strong>Click karo</strong> ya image yahan <strong>drag &amp; drop</strong> karo</p>
    <p>Ek ya multiple images — dono chalega</p>
    <input type="file" id="file" accept="image/*" multiple class="hidden" />
  </div>

  <div class="bar hidden" id="actionBar">
    <button id="downloadAll">⬇ Sab download karo</button>
    <button id="clear" class="ghost">Clear</button>
  </div>

  <div class="grid" id="grid"></div>
</div>

<script>
  const TARGET_W = 1080, TARGET_H = 1350;
  const dropEl = document.getElementById('drop');
  const fileEl = document.getElementById('file');
  const grid = document.getElementById('grid');
  const fmtEl = document.getElementById('fmt');
  const bgWrap = document.getElementById('bgWrap');
  const bgColorEl = document.getElementById('bgColor');
  const modeSeg = document.getElementById('modeSeg');
  const actionBar = document.getElementById('actionBar');

  let mode = 'blur';
  let items = []; // { name, img }

  const blurWrap = document.getElementById('blurWrap');
  const blurAmtEl = document.getElementById('blurAmt');

  modeSeg.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    [...modeSeg.children].forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    mode = btn.dataset.mode;
    bgWrap.classList.toggle('hidden', mode !== 'contain');
    blurWrap.classList.toggle('hidden', mode !== 'blur');
    renderAll();
  });

  fmtEl.addEventListener('change', renderAll);
  bgColorEl.addEventListener('input', renderAll);
  blurAmtEl.addEventListener('input', renderAll);

  dropEl.addEventListener('click', () => fileEl.click());
  dropEl.addEventListener('dragover', (e) => { e.preventDefault(); dropEl.classList.add('hover'); });
  dropEl.addEventListener('dragleave', () => dropEl.classList.remove('hover'));
  dropEl.addEventListener('drop', (e) => {
    e.preventDefault(); dropEl.classList.remove('hover');
    handleFiles(e.dataTransfer.files);
  });
  fileEl.addEventListener('change', () => handleFiles(fileEl.files));

  document.getElementById('clear').addEventListener('click', () => {
    items = []; renderAll();
  });
  document.getElementById('downloadAll').addEventListener('click', () => {
    document.querySelectorAll('.dl').forEach((a, i) => {
      setTimeout(() => a.click(), i * 250);
    });
  });

  function handleFiles(fileList) {
    [...fileList].filter(f => f.type.startsWith('image/')).forEach(f => {
      const img = new Image();
      img.onload = () => {
        items.push({ name: cleanName(f.name), img });
        renderAll();
      };
      img.src = URL.createObjectURL(f);
    });
  }

  function cleanName(n) {
    const base = n.replace(/\.[^.]+$/, '');
    return base + '_1080x1350';
  }

  function process(img) {
    const canvas = document.createElement('canvas');
    canvas.width = TARGET_W; canvas.height = TARGET_H;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = 'high';

    const sw = img.naturalWidth, sh = img.naturalHeight;
    const targetRatio = TARGET_W / TARGET_H; // 0.8

    if (mode === 'cover') {
      // crop source to 4:5, centered, then fill canvas
      let cropW, cropH;
      if (sw / sh > targetRatio) {
        cropH = sh; cropW = sh * targetRatio;
      } else {
        cropW = sw; cropH = sw / targetRatio;
      }
      const sx = (sw - cropW) / 2;
      const sy = (sh - cropH) / 2;
      ctx.drawImage(img, sx, sy, cropW, cropH, 0, 0, TARGET_W, TARGET_H);
    } else if (mode === 'blur') {
      // blurred zoomed copy fills the frame, full sharp image centered on top
      // 1) background: cover (fills frame) + blur
      const bgScale = Math.max(TARGET_W / sw, TARGET_H / sh);
      const bw = sw * bgScale, bh = sh * bgScale;
      ctx.filter = 'blur(' + blurAmtEl.value + 'px)';
      ctx.drawImage(img, 0, 0, sw, sh, (TARGET_W - bw) / 2, (TARGET_H - bh) / 2, bw, bh);
      ctx.filter = 'none';
      // slight dark overlay so the sharp image pops
      ctx.fillStyle = 'rgba(0,0,0,0.18)';
      ctx.fillRect(0, 0, TARGET_W, TARGET_H);
      // 2) foreground: full image, nothing cropped, fit inside
      const fScale = Math.min(TARGET_W / sw, TARGET_H / sh);
      const fw = sw * fScale, fh = sh * fScale;
      ctx.drawImage(img, 0, 0, sw, sh, (TARGET_W - fw) / 2, (TARGET_H - fh) / 2, fw, fh);
    } else {
      // contain: fill bg, fit whole image inside (nothing cropped)
      ctx.fillStyle = bgColorEl.value;
      ctx.fillRect(0, 0, TARGET_W, TARGET_H);
      const scale = Math.min(TARGET_W / sw, TARGET_H / sh);
      const dw = sw * scale, dh = sh * scale;
      const dx = (TARGET_W - dw) / 2;
      const dy = (TARGET_H - dh) / 2;
      ctx.drawImage(img, 0, 0, sw, sh, dx, dy, dw, dh);
    }
    return canvas;
  }

  function renderAll() {
    grid.innerHTML = '';
    actionBar.classList.toggle('hidden', items.length === 0);
    const fmt = fmtEl.value;
    const ext = fmt === 'image/png' ? 'png' : 'jpg';
    items.forEach((it) => {
      const canvas = process(it.img);
      const url = canvas.toDataURL(fmt, 0.95);
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="preview"><img src="${url}" alt=""></div>
        <div class="meta">
          <span>${it.img.naturalWidth}×${it.img.naturalHeight}</span>
          <span>→ 1080×1350</span>
        </div>
        <a class="dl" href="${url}" download="${it.name}.${ext}">⬇ Download</a>
      `;
      grid.appendChild(card);
    });
  }
</script>
</body>
</html>
